apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  opencode.jsonc: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "qwen-l4": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen2.5-Coder-7B-AWQ (L4)",
          "options": {
            "baseURL": "<MODEL_URL>/v1",
            "apiKey": "none"
          },
          "models": {
            "qwen25-coder-7b-awq": {
              "limit": {
                "context": 8192,
                "output": 4096
              }
            }
          }
        }
      },
      "model": "qwen-l4/qwen25-coder-7b-awq"
    }
