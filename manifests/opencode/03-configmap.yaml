apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  opencode.jsonc: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "qwen-l4": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3-14B-AWQ (L4)",
          "options": {
            "baseURL": "<MODEL_URL>/v1",
            "apiKey": "none"
          },
          "models": {
            "qwen3-14b-awq": {
              "limit": {
                "context": 32768,
                "output": 8192
              }
            }
          }
        }
      },
      "model": "qwen-l4/qwen3-14b-awq",
      "permission": {
        "edit": "allow",
        "bash": "allow"
      }
    }
