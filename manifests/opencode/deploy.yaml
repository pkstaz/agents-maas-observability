# OpenCode pod (opencode serve + oc). Namespace placeholder `opencode`; apply.sh
# reemplaza namespace e imagen.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode-agent
  namespace: opencode
---
# Workshop-only: OpenCode administra el cluster via skills.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-agent-cluster-admin
subjects:
  - kind: ServiceAccount
    name: opencode-agent
    namespace: opencode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-agent
  namespace: opencode
  labels:
    app: opencode-agent
    opendatahub.io/dashboard: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode-agent
  template:
    metadata:
      labels:
        app: opencode-agent
        opendatahub.io/dashboard: "true"
    spec:
      serviceAccountName: opencode-agent
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: opencode-config
      containers:
        - name: opencode
          image: image-registry.openshift-image-registry.svc:5000/opencode/opencode-agent:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /opt/app-secrets/opencode.jsonc
              subPath: opencode.jsonc
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mkdir -p $HOME/.config/opencode &&
              cp /opt/app-secrets/opencode.jsonc $HOME/.config/opencode/opencode.json &&
              exec /opt/app/node_modules/.bin/opencode serve --hostname 0.0.0.0 --port 4096 --cors https://app.opencode.ai
          ports:
            - containerPort: 4096
              name: http
          readinessProbe:
            httpGet:
              path: /global/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /global/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-agent
  namespace: opencode
  labels:
    app: opencode-agent
spec:
  selector:
    app: opencode-agent
  ports:
    - name: http
      port: 4096
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: opencode-agent
  namespace: opencode
  labels:
    app: opencode-agent
spec:
  to:
    kind: Service
    name: opencode-agent
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
