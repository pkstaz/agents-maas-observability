apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: opencode-agent
  namespace: opencode
---
# Build con el Dockerfile inline (mismo contenido que manifests/opencode/Dockerfile).
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: opencode-agent
  namespace: opencode
spec:
  source:
    type: Dockerfile
    dockerfile: |
      FROM registry.access.redhat.com/ubi9/nodejs-22:latest

      ENV HOME=/tmp
      ENV PATH=/opt/app/bin:$PATH

      WORKDIR /opt/app

      RUN npm install opencode-ai@latest --no-audit --no-fund \
          && mkdir -p /opt/app/bin \
          && curl -Ls https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
             | tar -xz -C /opt/app/bin oc kubectl \
          && ./node_modules/.bin/opencode --version \
          && /opt/app/bin/oc version --client

      EXPOSE 4096

      CMD ["/opt/app/node_modules/.bin/opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096", "--cors", "https://app.opencode.ai"]
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: opencode-agent:latest
  triggers:
    - type: ConfigChange
